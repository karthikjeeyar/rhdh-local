includes:
  - dynamic-plugins.default.yaml
plugins:
  - package: oci://quay.io/karthik_jk/lightspeed:0dbd3bf!red-hat-developer-hub-backstage-plugin-lightspeed
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          red-hat-developer-hub.backstage-plugin-lightspeed:
            appIcons:
              - name: LightspeedIcon
                module: LightspeedPlugin
                importName: LightspeedIcon
            dynamicRoutes:
              - path: /lightspeed
                importName: LightspeedPage
                module: LightspeedPlugin
                menuItem:
                  icon: LightspeedIcon
                  text: Lightspeed
  - package: oci://quay.io/karthik_jk/lightspeed:0dbd3bf!red-hat-developer-hub-backstage-plugin-lightspeed-backend-dynamic
    disabled: false
